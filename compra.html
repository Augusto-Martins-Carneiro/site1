<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Compra</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <div class="container nav-container">
        <h1 class="logo">Carflix</h1>
    </div>
</header>

<main class="container">

    <h2 class="section-title">Finalizar Compra</h2>

    <p>
        Carro selecionado:
        <strong id="carroSelecionado"></strong>
    </p>

    <form class="form-compra" action="sucesso.html">

        <label>Nome completo</label>
        <input type="text" placeholder="Digite seu nome" required>

        <label>CPF</label>
        <input type="text" placeholder="000.000.000-00" required>

        <label>Endereço</label>
        <input type="text" placeholder="Rua, número, cidade" required>

        <label>Forma de pagamento</label>
        <select required>
            <option>Cartão de crédito</option>
            <option>Cartão de débito</option>
            <option>PIX</option>
            <option>Boleto</option>
        </select>

        <button type="submit" class="btn-primary">
            Confirmar Compra
        </button>

    </form>

    <br>

    <a href="index.html" class="btn-buy">Voltar</a>

</main>

<script src="script.js"></script>

</body>
</html>
