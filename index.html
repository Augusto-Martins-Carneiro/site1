<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carflix</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="container nav-container">
            <h1 class="logo">Carflix</h1>

            <nav>
                <ul class="nav-links">
                    <li><a href="#">Veiculos novos</a></li>
                        <li><a href="#">Veiculos semi-novos</a></li>
                            <li><a href="#contato">Entre em contato</a></li>
                </ul>
            </nav>

            <button class="menu-toggle" id="menu-toggle">=</button>
        </div>
    </header>

    <section class="banner">
        <div class="container banner-content">
            <h2>Seu usado vale mais aqui na Carflix</h2>
            <buttom id="cotacaoBtn" class="btn-primary">Faça uma cotação</buttom>
        </div>
    </section>

    <main class="container">
        <h2 class="section-title">Veiculos destacados</h2>

        <div class="card">
            <div class="card"><img src="caminho.jpg" alt="descriçao-imagem">
                <h3>Honda Civic 2024</h3>
                <p>Cor: Vermelho</p>
                <p class="Price">140.000.000</p>
                <img src="imagem civic" alt="descricao">

                <button class="btn-buy">Comprar</button>
        </div>

        <div class="card">
            <div class="card"><img src="imagem" alt="descricao">
                <h3 Toyota Corolla 2020></h3>
                <p>Cor: Azul</p>
                <p class="Price">107.000.000</p>
                <img src="imagem corolla 2020" alt="descricao">

                <button class="btn-buy">Comprar</button>
        </div>
    </main>



</body>
</html>
